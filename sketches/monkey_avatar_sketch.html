<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Marvis monkey avatar — rough sketch</title>
<style>
  html, body {
    margin: 0; padding: 0; height: 100%; overflow: hidden;
    background: #12151b; color: #cfd8e3; font-family: Segoe UI, sans-serif;
  }
  body { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; }
  #stage { display: block; }
  #status {
    font-size: 14px; letter-spacing: 0.12em; color: #6b7686; text-transform: uppercase;
  }
  #bar { display: flex; gap: 10px; }
  button {
    background: #1c212b; color: #cfd8e3; border: 1px solid #2c3240;
    border-radius: 6px; padding: 9px 16px; font-size: 14px; cursor: pointer;
  }
  button:hover { background: #232a37; }
  button.active { border-color: #4da3ff; color: #4da3ff; }
  #note { font-size: 12px; color: #55606f; max-width: 420px; text-align: center; line-height: 1.5; }
</style>
</head>
<body>
  <canvas id="stage" width="440" height="440"></canvas>
  <div id="status">Idle</div>
  <div id="bar">
    <button data-mode="idle" class="active">Idle</button>
    <button data-mode="thinking">Thinking</button>
    <button data-mode="speaking">Speaking</button>
    <button data-mode="auto">Auto-cycle</button>
  </div>
  <div id="note">
    Rough procedural sketch — not final art. Shows the motion idea: breathing idle,
    hand-to-temple thinking, and mouth driven by a faked volume signal for speaking.
  </div>
<script>
const canvas = document.getElementById('stage');
const ctx = canvas.getContext('2d');
const statusEl = document.getElementById('status');
const REF = 440, CX = REF / 2, CY = REF / 2 + 10;

const ACCENT = '#4da3ff';
let mode = 'idle';
let autoCycle = false;
let modeStart = performance.now();

// --- controls ---
document.querySelectorAll('#bar button').forEach((b) => {
  b.addEventListener('click', () => {
    document.querySelectorAll('#bar button').forEach((x) => x.classList.remove('active'));
    b.classList.add('active');
    const m = b.dataset.mode;
    if (m === 'auto') { autoCycle = true; }
    else { autoCycle = false; mode = m; }
    modeStart = performance.now();
  });
});

function setStatus() {
  statusEl.textContent = mode === 'thinking' ? 'Thinking…'
    : mode === 'speaking' ? 'Speaking…' : 'Idle';
}

// A faked speech envelope so the mouth moves like it's talking, with syllable
// gaps and pauses. Stands in for the real 5-band volume feed the app already has.
let level = 0;
function fakeLevel(t) {
  const gate = Math.max(0, Math.sin(t / 380) * 0.6 + Math.sin(t / 90 + 1.1) * 0.5);
  const syllable = 0.5 + 0.5 * Math.sin(t / 55);
  const flutter = 0.15 * Math.sin(t / 19);
  let v = gate * syllable + flutter;
  // occasional full pause
  if (Math.sin(t / 900) > 0.7) v *= 0.15;
  return Math.max(0, Math.min(1, v));
}

// --- blink timer ---
let nextBlink = 1500, blinkT = -1;
function eyeOpenFactor(now) {
  if (now > nextBlink && blinkT < 0) { blinkT = now; }
  if (blinkT >= 0) {
    const d = now - blinkT;
    if (d > 170) { blinkT = -1; nextBlink = now + 2200 + Math.random() * 2600; return 1; }
    // quick close then open
    return Math.abs(d - 85) / 85; // 1 -> 0 -> 1
  }
  return 1;
}

function rr(x, y, w, h, r) {
  ctx.beginPath();
  ctx.roundRect(x, y, w, h, r);
}

// A single rounded fur tuft: base centered at (x,y), pointing outward along
// the (nx,ny) normal. Drawn behind the head so the tips poke past its edge.
function furTuft(x, y, nx, ny, len, wid) {
  const tx = -ny, ty = nx; // tangent
  ctx.beginPath();
  ctx.moveTo(x - tx * wid, y - ty * wid);
  ctx.quadraticCurveTo(x + nx * len * 0.5, y + ny * len * 0.5, x + nx * len, y + ny * len);
  ctx.quadraticCurveTo(x + nx * len * 0.5, y + ny * len * 0.5, x + tx * wid, y + ty * wid);
  ctx.closePath();
  ctx.fill();
}

// A dense ring of little tufts all the way around the head, in three shades
// for depth, so he reads as furry like the logo rather than bald metal.
function drawFur(t) {
  const rx = 80, ry = 86;
  const N = 30;
  // back layer: longest, darkest — full ring
  ctx.fillStyle = '#182642';
  for (let i = 0; i < N; i++) {
    const a = (i / N) * Math.PI * 2;
    const nx = Math.cos(a), ny = Math.sin(a);
    const w = Math.sin(t / 900 + i) * 1.2;
    furTuft(nx * (rx - 4), ny * (ry - 4), nx, ny, 22 + w, 10);
  }
  // mid layer: offset half a step, medium
  ctx.fillStyle = '#243a63';
  for (let i = 0; i < N; i++) {
    const a = ((i + 0.5) / N) * Math.PI * 2;
    const nx = Math.cos(a), ny = Math.sin(a);
    const w = Math.sin(t / 750 + i * 1.3) * 1.3;
    furTuft(nx * (rx - 9), ny * (ry - 9), nx, ny, 16 + w, 7);
  }
  // front layer: shortest, lightest
  ctx.fillStyle = '#35548a';
  for (let i = 0; i < N; i++) {
    const a = ((i + 0.25) / N) * Math.PI * 2;
    const nx = Math.cos(a), ny = Math.sin(a);
    const w = Math.sin(t / 700 + i * 1.7) * 1.4;
    furTuft(nx * (rx - 13), ny * (ry - 13), nx, ny, 11 + w, 5);
  }
}

// --- articulated robot hand parts (used by the thinking pose) ---
const HAND_SEG = '#3a5c9a';   // finger/limb fill — close to the monkey's own blue
const HAND_JNT = '#4a70aa';   // knuckle joints — only a touch lighter, subtle
const HAND_EDGE = 'rgba(10,16,32,0.40)';

// one cylindrical segment from a->b, with a soft edge and a faint sheen
function limb(ax, ay, bx, by, w) {
  ctx.lineCap = 'round';
  ctx.strokeStyle = HAND_EDGE; ctx.lineWidth = w + 1.5;
  ctx.beginPath(); ctx.moveTo(ax, ay); ctx.lineTo(bx, by); ctx.stroke();
  ctx.strokeStyle = HAND_SEG; ctx.lineWidth = w;
  ctx.beginPath(); ctx.moveTo(ax, ay); ctx.lineTo(bx, by); ctx.stroke();
  ctx.strokeStyle = 'rgba(140,175,235,0.12)'; ctx.lineWidth = Math.max(1, w * 0.26);
  ctx.beginPath(); ctx.moveTo(ax, ay); ctx.lineTo(bx, by); ctx.stroke();
}
// a subtle knuckle joint (small and low-contrast — not exaggerated)
function knuckle(x, y, r) {
  ctx.fillStyle = HAND_JNT;
  ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill();
}
// a finger as a chain of joints (pts = [[x,y],...] base->tip)
function roboFinger(pts, w) {
  for (let i = 0; i < pts.length - 1; i++) limb(pts[i][0], pts[i][1], pts[i + 1][0], pts[i + 1][1], w);
  for (let i = 0; i < pts.length; i++) knuckle(pts[i][0], pts[i][1], w * 0.58);
}

// ---- the monkey ----
function drawMonkey(t, opts) {
  const { bob, breathe, eyeOpen, lookUp, mouthOpen, browTilt, arm, glow } = opts;
  ctx.save();
  ctx.translate(CX, CY + bob);
  ctx.scale(breathe, breathe);

  // soft back glow
  const g = ctx.createRadialGradient(0, 0, 20, 0, 0, 150);
  g.addColorStop(0, `rgba(77,163,255,${0.10 + glow * 0.16})`);
  g.addColorStop(1, 'rgba(77,163,255,0)');
  ctx.fillStyle = g;
  ctx.beginPath(); ctx.arc(0, 0, 150, 0, Math.PI * 2); ctx.fill();

  // ears (robotic discs)
  for (const sx of [-1, 1]) {
    ctx.save(); ctx.translate(sx * 82, -6);
    ctx.fillStyle = '#243456';
    ctx.beginPath(); ctx.arc(0, 0, 30, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#161d30';
    ctx.beginPath(); ctx.arc(0, 0, 19, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = ACCENT;
    ctx.beginPath(); ctx.arc(0, 0, 4, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
  }

  // antenna
  const sway = Math.sin(t / 700) * 6;
  ctx.strokeStyle = '#3a5c9a'; ctx.lineWidth = 4; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(0, -80); ctx.lineTo(sway, -112); ctx.stroke();
  ctx.fillStyle = ACCENT; ctx.shadowColor = ACCENT; ctx.shadowBlur = 12;
  ctx.beginPath(); ctx.arc(sway, -116, 7, 0, Math.PI * 2); ctx.fill();
  ctx.shadowBlur = 0;

  // fur (behind the head, tips poke out past the panel edge)
  drawFur(t);

  // head (metallic rounded panel)
  const head = ctx.createLinearGradient(0, -84, 0, 74);
  head.addColorStop(0, '#2c4272');
  head.addColorStop(1, '#182238');
  ctx.fillStyle = head;
  ctx.strokeStyle = 'rgba(120,180,255,0.35)'; ctx.lineWidth = 2;
  rr(-78, -84, 156, 158, 52); ctx.fill(); ctx.stroke();

  // panel seam
  ctx.strokeStyle = 'rgba(120,180,255,0.15)'; ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.moveTo(-70, -8); ctx.lineTo(70, -8); ctx.stroke();

  // muzzle plate
  ctx.fillStyle = '#20304f';
  rr(-52, 6, 104, 66, 30); ctx.fill();
  ctx.strokeStyle = 'rgba(120,180,255,0.18)'; ctx.stroke();

  // brows (two level plates, one per eye — no unibrow, never angled: stoic)
  for (const sx of [-1, 1]) {
    ctx.save();
    ctx.translate(sx * 32, -47);
    ctx.fillStyle = '#3a5c9a';
    rr(-25, -5, 50, 9, 4); ctx.fill();
    ctx.fillStyle = 'rgba(160,205,255,0.28)';
    rr(-25, -5, 50, 2.6, 2); ctx.fill();
    ctx.restore();
  }

  // eyes
  for (const sx of [-1, 1]) {
    ctx.save(); ctx.translate(sx * 32, -26);
    // socket
    ctx.fillStyle = '#0e1524';
    ctx.beginPath(); ctx.arc(0, 0, 22, 0, Math.PI * 2); ctx.fill();
    // lens (scaled vertically for blink)
    ctx.save(); ctx.scale(1, Math.max(0.06, eyeOpen));
    const eg = ctx.createRadialGradient(0, 0, 1, 0, 0, 18);
    eg.addColorStop(0, '#eaf5ff');
    eg.addColorStop(0.5, ACCENT);
    eg.addColorStop(1, '#1c4a8a');
    ctx.fillStyle = eg;
    ctx.shadowColor = ACCENT; ctx.shadowBlur = 14;
    ctx.beginPath(); ctx.arc(0, 0, 16, 0, Math.PI * 2); ctx.fill();
    ctx.shadowBlur = 0;
    // pupil (kept centered in the eye)
    ctx.fillStyle = '#0b1220';
    ctx.beginPath(); ctx.arc(0, 0, 6, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
    ctx.restore();
  }

  // nose (small pad with two nostrils, sits between eyes and mouth) -- nudged up
  // from y=16 to leave the mouth below more room before the muzzle plate's edge
  ctx.save(); ctx.translate(0, 10);
  ctx.fillStyle = '#2b456f';
  rr(-8, -8, 16, 20, 7); ctx.fill();
  ctx.strokeStyle = 'rgba(120,180,255,0.18)'; ctx.lineWidth = 1.5; ctx.stroke();
  ctx.fillStyle = '#0c1322';
  for (const sx of [-1, 1]) {
    ctx.beginPath(); ctx.ellipse(sx * 4, 6, 2.6, 3.4, sx * 0.4, 0, Math.PI * 2); ctx.fill();
  }
  ctx.restore();

  // mouth (a rounder opening that grows with volume — reads as an O when talking),
  // growing from its centre outward (both mrx and mry scale from the same fixed
  // point) rather than hinging open from a fixed top lip. MOUTH_CY is the midpoint
  // between the nose (now at y=10..22) and the muzzle plate's edge (y=6..72), and
  // mry is capped so it still can't reach either at MOUTH_CY +/- 20.
  const MOUTH_CY = 47;
  const mrx = 17 + mouthOpen * 11;
  const mry = 3 + mouthOpen * 17;
  ctx.save(); ctx.translate(0, MOUTH_CY);
  ctx.fillStyle = '#0c1322';
  ctx.beginPath(); ctx.ellipse(0, 0, mrx, mry, 0, 0, Math.PI * 2); ctx.fill();
  ctx.strokeStyle = 'rgba(120,180,255,0.4)'; ctx.lineWidth = 1.5; ctx.stroke();
  // faint inner rim so the open mouth has a little depth
  if (mouthOpen > 0.15) {
    ctx.strokeStyle = `rgba(120,180,255,${mouthOpen * 0.25})`;
    ctx.beginPath(); ctx.ellipse(0, mry * 0.15, mrx * 0.6, mry * 0.55, 0, 0, Math.PI * 2); ctx.stroke();
  }
  ctx.restore();

  // thinking — an articulated robot hand at the temple: index extended, the
  // other fingers curled, on a mechanical wrist. Compact and monkey-sized.
  if (arm > 0.01) {
    ctx.save();
    ctx.globalAlpha = arm;
    ctx.translate(0, -16);                       // sit the whole hand higher
    const scr = Math.sin(t / 130) * 1.5 * arm;   // subtle finger movement
    const idxMid = [92, -26];                    // raised knuckle (the bend)
    const tipx = 79, tipy = -22 + scr;           // tip hooks back in to the temple

    // forearm stub + wrist hinge (behind the palm, kept short)
    limb(122, 20, 139, 31, 12);
    knuckle(139, 31, 6.5);
    knuckle(122, 20, 8);

    // palm block
    ctx.fillStyle = HAND_EDGE;
    rr(95, -9, 33, 28, 9); ctx.fill();
    ctx.fillStyle = HAND_SEG;
    rr(96.5, -7.5, 30, 25, 8); ctx.fill();
    ctx.fillStyle = 'rgba(175,205,255,0.12)';
    rr(96.5, -7.5, 30, 7, 6); ctx.fill();

    // curled fingers, tightly curled into a loose fist (index stays extended)
    roboFinger([[112, 6], [106, 0], [108, 8]], 6);      // pinky
    roboFinger([[109, 1], [101, -6], [104, 4]], 6.5);   // ring
    roboFinger([[105, -3], [96, -12], [100, -2]], 7);   // middle
    // thumb, curling up to meet the fingers
    roboFinger([[98, 10], [91, 6], [90, -1]], 6.5);
    // index, extended to the temple
    roboFinger([[101, -7], idxMid, [tipx, tipy]], 7);

    // very small nail on the index tip
    const nang = Math.atan2(tipy - idxMid[1], tipx - idxMid[0]);
    ctx.fillStyle = '#cdddf6';
    ctx.beginPath();
    ctx.ellipse(tipx + Math.cos(nang) * 1.6, tipy + Math.sin(nang) * 1.6, 2.4, 1.6, nang, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();

    // thought dots
    for (let i = 0; i < 3; i++) {
      const a = 0.3 + 0.7 * (0.5 + 0.5 * Math.sin(t / 300 - i));
      ctx.fillStyle = `rgba(120,180,255,${a * arm})`;
      ctx.beginPath(); ctx.arc(-78 - i * 16, -78 - i * 12, 4 + i, 0, Math.PI * 2); ctx.fill();
    }
  }

  ctx.restore();
}

function frame() {
  const now = performance.now();
  const t = now;

  if (autoCycle) {
    const seq = ['idle', 'thinking', 'speaking'];
    mode = seq[Math.floor((now - modeStart) / 3000) % 3];
  }
  setStatus();

  ctx.clearRect(0, 0, REF, REF);

  const opts = {
    bob: 0, breathe: 1, eyeOpen: eyeOpenFactor(now), lookUp: 0,
    mouthOpen: 0, browTilt: 0, arm: 0, glow: 0,
  };

  if (mode === 'idle') {
    opts.bob = Math.sin(t / 1400) * 4;
    opts.breathe = 1 + Math.sin(t / 1400) * 0.012;
    opts.glow = 0.2 + 0.15 * (0.5 + 0.5 * Math.sin(t / 1800));
    opts.mouthOpen = 0.02;
  } else if (mode === 'thinking') {
    opts.bob = Math.sin(t / 1100) * 2;
    opts.lookUp = 1;
    opts.browTilt = -0.06;
    opts.arm = 1;
    opts.glow = 0.28;
    opts.mouthOpen = 0.02;
  } else if (mode === 'speaking') {
    level += (fakeLevel(t) - level) * 0.35;
    opts.mouthOpen = level;
    opts.bob = -level * 3 + Math.sin(t / 900) * 2;
    opts.glow = 0.25 + level * 0.4;
    opts.breathe = 1 + level * 0.02;
  }

  drawMonkey(t, opts);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
