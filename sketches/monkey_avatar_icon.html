<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Marvis avatar — app-icon base</title>
<style>
  html, body {
    margin: 0; padding: 0; height: 100%; overflow: hidden;
    background: #12151b; color: #cfd8e3; font-family: Segoe UI, sans-serif;
  }
  body { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; }
  #stage { display: block; }
  #status {
    font-size: 14px; letter-spacing: 0.12em; color: #6b7686; text-transform: uppercase;
  }
  #bar { display: flex; gap: 10px; }
  button {
    background: #1c212b; color: #cfd8e3; border: 1px solid #2c3240;
    border-radius: 6px; padding: 9px 16px; font-size: 14px; cursor: pointer;
  }
  button:hover { background: #232a37; }
  button.active { border-color: #4da3ff; color: #4da3ff; }
  #note { font-size: 12px; color: #55606f; max-width: 440px; text-align: center; line-height: 1.5; }
</style>
</head>
<body>
  <canvas id="stage" width="440" height="440"></canvas>
  <div id="status">Idle</div>
  <div id="bar">
    <button data-mode="idle" class="active">Idle</button>
    <button data-mode="thinking">Thinking</button>
    <button data-mode="speaking">Speaking</button>
    <button data-mode="auto">Auto-cycle</button>
  </div>
  <div id="note">
    Same motion as the procedural sketch, but the real app icon is the base:
    breathing idle, a thought-cloud think that resolves into a lightbulb, and a
    mouth driven by a faked volume signal for speaking.
  </div>
<script>
const canvas = document.getElementById('stage');
const ctx = canvas.getContext('2d');
const statusEl = document.getElementById('status');
const REF = 440, CX = REF / 2, CY = REF / 2 + 6;

const ACCENT = '#4da3ff';
const BG = '#12151b';
const PUPIL = '#0c1526';   // one pupil colour, used in every mode

// the app icon (single flat blue on transparency)
const icon = new Image();
icon.src = 'icon.png';

// icon drawn size, and feature positions mapped into the drawing frame
const S = 280;                       // on-screen icon size
const EYES = [[-38, 2], [39, 1]];    // eye centers (measured from the icon)
const EYE_R = 19;                    // outer radius of the blue donut eye
const HOLE_R = 9;                    // the transparent centre of the donut
const NOSE = [[-10, 33], [10, 33]];  // nudged up from [[-7,38],[13,39]] for mouth clearance
// The visor's dark area ends around y=78 (solid chin/jaw past that). MOUTH_CY is the
// midpoint of the y~45-71 gap between nose and chin, and the mry cap keeps the
// mouth's symmetric growth from that centre inside it.
const MOUTH_X = 0.5, MOUTH_CY = 58;
const ANT = [0, -110], ANT_R = 11;   // antenna bulb

let mode = 'idle';
let prevMode = 'idle';
let bulbUntil = 0;         // wall-clock ms until which the "idea" bulb shows
let autoCycle = false;
let modeStart = performance.now();

document.querySelectorAll('#bar button').forEach((b) => {
  b.addEventListener('click', () => {
    document.querySelectorAll('#bar button').forEach((x) => x.classList.remove('active'));
    b.classList.add('active');
    const m = b.dataset.mode;
    if (m === 'auto') { autoCycle = true; }
    else { autoCycle = false; mode = m; }
    modeStart = performance.now();
  });
});

function setStatus() {
  statusEl.textContent = mode === 'thinking' ? 'Thinking…'
    : mode === 'speaking' ? 'Speaking…' : 'Idle';
}

// faked speech envelope (stands in for the real 5-band volume feed)
let level = 0;
function fakeLevel(t) {
  const gate = Math.max(0, Math.sin(t / 380) * 0.6 + Math.sin(t / 90 + 1.1) * 0.5);
  const syllable = 0.5 + 0.5 * Math.sin(t / 55);
  const flutter = 0.15 * Math.sin(t / 19);
  let v = gate * syllable + flutter;
  if (Math.sin(t / 900) > 0.7) v *= 0.15;
  return Math.max(0, Math.min(1, v));
}

// blink timer
let nextBlink = 1500, blinkT = -1;
function eyeOpenFactor(now) {
  if (now > nextBlink && blinkT < 0) { blinkT = now; }
  if (blinkT >= 0) {
    const d = now - blinkT;
    if (d > 170) { blinkT = -1; nextBlink = now + 2200 + Math.random() * 2600; return 1; }
    return Math.abs(d - 85) / 85;
  }
  return 1;
}

function rr(x, y, w, h, r) { ctx.beginPath(); ctx.roundRect(x, y, w, h, r); }

// --- lit lightbulb: the "idea!" that pops in for a moment after thinking ---
function drawBulb(x, y, s, a) {
  ctx.save();
  ctx.translate(x, y);
  ctx.scale(s, s);
  ctx.globalAlpha = a;

  // warm glow
  const gg = ctx.createRadialGradient(0, -2, 2, 0, -2, 34);
  gg.addColorStop(0, 'rgba(255,224,130,0.9)');
  gg.addColorStop(1, 'rgba(255,224,130,0)');
  ctx.fillStyle = gg;
  ctx.beginPath(); ctx.arc(0, -2, 34, 0, Math.PI * 2); ctx.fill();

  // idea rays
  ctx.strokeStyle = 'rgba(255,214,90,0.95)';
  ctx.lineWidth = 2.4; ctx.lineCap = 'round';
  for (let i = 0; i < 8; i++) {
    const ang = (i / 8) * Math.PI * 2;
    ctx.beginPath();
    ctx.moveTo(Math.cos(ang) * 18, Math.sin(ang) * 18 - 2);
    ctx.lineTo(Math.cos(ang) * 24, Math.sin(ang) * 24 - 2);
    ctx.stroke();
  }

  // glass bulb
  ctx.fillStyle = '#fff4c2';
  ctx.strokeStyle = '#e0b23a'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.arc(0, -2, 12, 0, Math.PI * 2); ctx.fill(); ctx.stroke();

  // filament
  ctx.strokeStyle = '#e6a11c'; ctx.lineWidth = 1.6; ctx.lineJoin = 'round';
  ctx.beginPath();
  ctx.moveTo(-4, 3); ctx.lineTo(-2, -4); ctx.lineTo(2, -4); ctx.lineTo(4, 3);
  ctx.stroke();

  // screw base
  ctx.fillStyle = '#9aa3b0';
  rr(-6, 8, 12, 9, 2); ctx.fill();
  ctx.strokeStyle = '#6b7280'; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(-6, 11); ctx.lineTo(6, 11); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(-6, 14); ctx.lineTo(6, 14); ctx.stroke();

  ctx.restore();
}

function drawMonkey(t, opts) {
  const { bob, breathe, eyeOpen, mouthOpen, glow, arm, bulb } = opts;
  ctx.save();
  ctx.translate(CX, CY + bob);
  ctx.scale(breathe, breathe);

  // soft back glow
  const g = ctx.createRadialGradient(0, 0, 20, 0, 0, 175);
  g.addColorStop(0, `rgba(77,163,255,${0.09 + glow * 0.18})`);
  g.addColorStop(1, 'rgba(77,163,255,0)');
  ctx.fillStyle = g;
  ctx.beginPath(); ctx.arc(0, 0, 175, 0, Math.PI * 2); ctx.fill();

  // the app icon itself
  if (icon.complete && icon.naturalWidth) {
    ctx.drawImage(icon, -S / 2, -S / 2, S, S);
  }

  // subtle eye glow so he feels alive
  for (const e of EYES) {
    const eg = ctx.createRadialGradient(e[0], e[1], 2, e[0], e[1], EYE_R * 1.25);
    eg.addColorStop(0, `rgba(150,205,255,${0.10 + 0.22 * glow})`);
    eg.addColorStop(1, 'rgba(150,205,255,0)');
    ctx.fillStyle = eg;
    ctx.beginPath(); ctx.arc(e[0], e[1], EYE_R * 1.25, 0, Math.PI * 2); ctx.fill();
  }

  // eyes — always show a pupil so he reads as alive; it glances up-left while thinking
  {
    const gx = arm > 0.01 ? -3 : 0;
    const gy = arm > 0.01 ? -3.5 : 0;
    for (const e of EYES) {
      ctx.fillStyle = ACCENT;                          // iris — fill the donut hole
      ctx.beginPath(); ctx.arc(e[0], e[1], HOLE_R + 2, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = PUPIL;                           // dark pupil — one colour in every mode
      ctx.beginPath(); ctx.arc(e[0] + gx, e[1] + gy, HOLE_R * 0.62, 0, Math.PI * 2); ctx.fill();
    }
  }

  // blink — the eye shuts from top and bottom, clipped to the eye so it reads as
  // the eye itself closing (dark, like the face) rather than a panel over it
  if (eyeOpen < 0.985) {
    const coverH = (EYE_R * 2 + 2) * (1 - eyeOpen);
    for (const e of EYES) {
      ctx.save();
      ctx.beginPath(); ctx.arc(e[0], e[1], EYE_R + 0.5, 0, Math.PI * 2); ctx.clip();
      ctx.fillStyle = BG;                              // a lid sweeping down from the eye's top
      ctx.fillRect(e[0] - EYE_R - 1, e[1] - EYE_R - 1, EYE_R * 2 + 2, coverH);
      ctx.restore();
    }
  }

  // mouth (added — the icon has none) opens with volume when speaking, growing from
  // its centre outward (both mrx and mry scale from the same fixed point) rather
  // than hinging open from a fixed top lip. mry is capped so it still can't reach
  // the nose or chin at MOUTH_CY +/- 13.
  if (mouthOpen > 0.05) {
    const mrx = 10 + mouthOpen * 13;
    const mry = 2 + mouthOpen * 11;
    ctx.fillStyle = '#0c1526';
    ctx.beginPath(); ctx.ellipse(MOUTH_X, MOUTH_CY, mrx, mry, 0, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = `rgba(130,195,255,${0.5 + mouthOpen * 0.4})`; ctx.lineWidth = 2.5;
    ctx.stroke();
  }

  // antenna bulb glow
  ctx.save();
  ctx.fillStyle = ACCENT; ctx.shadowColor = ACCENT; ctx.shadowBlur = 9 + glow * 16;
  ctx.beginPath(); ctx.arc(ANT[0], ANT[1], ANT_R * 0.85, 0, Math.PI * 2); ctx.fill();
  ctx.restore();

  // thinking — a thought cloud rises to the upper-left
  if (arm > 0.01) {
    // cartoony thought bubbles: a little trail rising to a puffy cloud (upper-left)
    const cb = Math.sin(t / 520) * 2;
    const trail = [[-80, -74, 4], [-100, -95, 6]];
    const cloud = [[-126, -115, 13.5], [-106, -125, 9.5], [-144, -123, 9.5], [-120, -133, 9.5]];
    const all = [];
    trail.forEach((p, i) => all.push([p[0], p[1] + Math.sin(t / 460 + i) * 1.5, p[2]]));
    cloud.forEach((p) => all.push([p[0], p[1] + cb, p[2]]));
    // stroke first, then fill on top, so overlaps read as one clean outlined cloud
    ctx.lineWidth = 3; ctx.lineJoin = 'round';
    ctx.strokeStyle = `rgba(77,163,255,${0.9 * arm})`;
    for (const c of all) { ctx.beginPath(); ctx.arc(c[0], c[1], c[2], 0, Math.PI * 2); ctx.stroke(); }
    ctx.fillStyle = `rgba(232,244,255,${0.95 * arm})`;
    for (const c of all) { ctx.beginPath(); ctx.arc(c[0], c[1], c[2], 0, Math.PI * 2); ctx.fill(); }
  }

  // idea! — a lit lightbulb pops in for a moment right after thinking ends
  if (bulb > 0.01) {
    drawBulb(-120, -116, 1.7 * (0.85 + 0.15 * bulb), bulb);
  }

  ctx.restore();
}

function frame() {
  const now = performance.now();
  const t = now;

  if (autoCycle) {
    const seq = ['idle', 'thinking', 'speaking'];
    mode = seq[Math.floor((now - modeStart) / 3000) % 3];
  }
  // leaving thinking triggers the lightbulb for one second
  if (prevMode === 'thinking' && mode !== 'thinking') bulbUntil = now + 1000;
  prevMode = mode;
  setStatus();

  ctx.clearRect(0, 0, REF, REF);

  const opts = { bob: 0, breathe: 1, eyeOpen: eyeOpenFactor(now), mouthOpen: 0, glow: 0, arm: 0, bulb: 0 };
  if (bulbUntil > now) {
    const life = 1 - (bulbUntil - now) / 1000;        // 0 -> 1 across the second
    opts.bulb = Math.min(1, life / 0.15, (1 - life) / 0.25);  // quick pop in, fade out
  }

  if (mode === 'idle') {
    opts.bob = Math.sin(t / 1400) * 4;
    opts.breathe = 1 + Math.sin(t / 1400) * 0.012;
    opts.glow = 0.2 + 0.15 * (0.5 + 0.5 * Math.sin(t / 1800));
  } else if (mode === 'thinking') {
    opts.bob = Math.sin(t / 1100) * 2;
    opts.arm = 1;
    opts.glow = 0.28;
  } else if (mode === 'speaking') {
    level += (fakeLevel(t) - level) * 0.35;
    opts.mouthOpen = level;
    opts.bob = -level * 3 + Math.sin(t / 900) * 2;
    opts.glow = 0.25 + level * 0.4;
    opts.breathe = 1 + level * 0.02;
  }

  drawMonkey(t, opts);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
